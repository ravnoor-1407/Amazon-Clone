<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — Amazon Clone</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Products Page Layout */
        .products-page { background: #EAEDED; min-height: 100vh; }

        .products-layout {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 12px;
            gap: 16px;
        }

        /* Sidebar Filters: Categories, Ratings */
        .filters-sidebar {
            width: 220px;
            flex-shrink: 0;
        }

        .filter-box {
            background: #fff;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 12px;
            font-size: 0.875rem;
        }

        .filter-box h3 {
            font-size: 0.95rem;
            font-weight: 700;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .filter-box label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .filter-box label:hover { color: #c45500; }

        .price-range-inputs {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }

        .price-range-inputs input {
            width: 70px;
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 0.8rem;
        }

        .price-range-inputs button {
            padding: 4px 10px;
            background: #febd68;
            border: 1px solid #e8a94c;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Main Product grid */
        .products-main { flex: 1; min-width: 0; }

        .results-header {
            background: #fff;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.875rem;
        }

        .results-header span { color: #555; }
        .results-header span b { color: #c45500; }

        .sort-select {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 0.875rem;
            cursor: pointer;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 12px;
        }

        .product-card {
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.14);
            transform: translateY(-2px);
        }

        .product-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #cc0c39;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 3px;
            z-index: 1;
        }

        .product-badge.bestseller { background: #e47911; }
        .product-badge.choice { background: #006021; }
        .product-badge.new { background: #007185; }
        .product-badge.sale { background: #cc0c39; }

        .product-img-wrap {
            height: 200px;
            overflow: hidden;
            background: #f8f8f8;
        }

        .product-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-img-wrap img { transform: scale(1.05); }

        .product-info {
            padding: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .product-name {
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.3;
            color: #0F1111;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-stars {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
        }

        .stars-visual { color: #e47911; font-size: 0.9rem; letter-spacing: -1px; }

        .review-count { color: #007185; font-size: 0.78rem; }
        .review-count:hover { color: #c45500; text-decoration: underline; }

        .product-price {
            margin-top: 4px;
        }

        .price-main {
            font-size: 1.05rem;
            font-weight: 700;
            color: #B12704;
        }

        .price-main sup { font-size: 0.65rem; vertical-align: super; }

        .price-original {
            font-size: 0.78rem;
            color: #888;
            text-decoration: line-through;
            margin-left: 4px;
        }

        .price-save {
            font-size: 0.75rem;
            color: #c45500;
            font-weight: 600;
        }

        .prime-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.72rem;
            color: #00A8E1;
            font-weight: 700;
            margin-top: 2px;
        }

        .card-actions {
            padding: 0 12px 12px;
            display: flex;
            gap: 6px;
        }

        .btn-add-cart {
            flex: 1;
            padding: 7px 0;
            background: #FFD814;
            border: 1px solid #FCD200;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-add-cart:hover { background: #f0c912; }

        .btn-wishlist-card {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid #ddd;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
            font-size: 0.9rem;
            color: #888;
        }

        .btn-wishlist-card:hover { border-color: #c40000; color: #c40000; }
        .btn-wishlist-card.active { color: #c40000; border-color: #c40000; }
        .btn-wishlist-card.active i { font-weight: 900; }

        /* No results: If no products match the filters */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        .no-results i { font-size: 3rem; color: #ccc; margin-bottom: 16px; display: block; }

        /* Responsive */
        @media (max-width: 760px) {
            .filters-sidebar { display: none; }
            .product-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body class="products-page">

    <!-- Navbar (identical to index.html) -->
    <header>
        <div class="navbar">
            <div class="nav-logo border" onclick="location.href='index.html'" style="cursor:pointer;">
                <div class="logo"></div>
            </div>
            <div class="nav-address border">
                <p class="address-one">Deliver to</p>
                <div class="address-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="address-two">India</p>
                </div>
            </div>
            <div class="nav-search">
                <select class="search-category" id="search-category">
                    <option>All</option>
                    <option>Clothes</option>
                    <option>Health & Personal Care</option>
                    <option>Furniture</option>
                    <option>Electronics</option>
                    <option>Beauty Picks</option>
                    <option>Pet Care & Essentials</option>
                    <option>New Arrivals in Toys</option>
                    <option>Discover Fashion Trends</option>
                </select>
                <input class="search-input" id="amazon-search" placeholder="Search Amazon">
                <div class="search-icon" id="search-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            <div class="nav-signin border">
                <p><span>Hello, sign in</span></p>
                <p class="nav-two">Accounts & Lists</p>
            </div>
            <div class="nav-return border">
                <p><span>Returns</span></p>
                <p class="nav-two">& Orders</p>
            </div>
            <div class="nav-cart border" id="nav-cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">Cart (0)</span>
            </div>
        </div>

        <div class="panel">
            <div class="panel-all"><i class="fa-solid fa-bars"></i> All</div>
            <div class="panel-options">
                <p>Today's Deals</p>
                <p>Customer Service</p>
                <p>Registry</p>
                <p>Gift Cards</p>
            </div>
        </div>
    </header>

    <!-- Page Layout -->
    <div class="products-layout">

        <!-- Sidebar Filters -->
        <aside class="filters-sidebar">
            <div class="filter-box">
                <h3>Department</h3>
                <label><input type="radio" name="cat" value="All" checked> All Departments</label>
                <label><input type="radio" name="cat" value="Clothes"> Clothes</label>
                <label><input type="radio" name="cat" value="Electronics"> Electronics</label>
                <label><input type="radio" name="cat" value="Furniture"> Furniture</label>
                <label><input type="radio" name="cat" value="Health & Personal Care"> Health &amp; Personal Care</label>
                <label><input type="radio" name="cat" value="Beauty Picks"> Beauty</label>
                <label><input type="radio" name="cat" value="Pet Care & Essentials"> Pet Supplies</label>
                <label><input type="radio" name="cat" value="New Arrivals in Toys"> Toys</label>
                <label><input type="radio" name="cat" value="Discover Fashion Trends"> Fashion Trends</label>
            </div>

            <div class="filter-box">
                <h3>Avg. Customer Review</h3>
                <label><input type="radio" name="rating" value="4"> ★★★★☆ &amp; Up</label>
                <label><input type="radio" name="rating" value="3"> ★★★☆☆ &amp; Up</label>
                <label><input type="radio" name="rating" value="0" checked> All ratings</label>
            </div>

            <div class="filter-box">
                <h3>Price</h3>
                <label><input type="radio" name="price" value="0-25"> Under $25</label>
                <label><input type="radio" name="price" value="25-50"> $25 – $50</label>
                <label><input type="radio" name="price" value="50-100"> $50 – $100</label>
                <label><input type="radio" name="price" value="100-999"> $100 &amp; Above</label>
                <label><input type="radio" name="price" value="0-9999" checked> All prices</label>
                <div class="price-range-inputs">
                    <input type="number" id="min-price" placeholder="Min" min="0">
                    <span>–</span>
                    <input type="number" id="max-price" placeholder="Max" min="0">
                    <button onclick="applyCustomPrice()">Go</button>
                </div>
            </div>
        </aside>

        <!-- Product Grid -->
        <main class="products-main">
            <div class="results-header">
                <span id="results-text">Loading products…</span>
                <select class="sort-select" id="sort-select">
                    <option value="featured">Sort by: Featured</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="rating">Avg. Customer Review</option>
                    <option value="newest">Newest Arrivals</option>
                </select>
            </div>
            <div class="product-grid" id="product-grid"></div>
        </main>
    </div>

    <!-- Cart Sidebar (same as index.html) -->
    <div id="cart-overlay"></div>
    <div id="cart-sidebar">
        <div id="cart-header" style="padding:16px;background:#232F3E;color:#fff;display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:1.1rem;font-weight:700;"><i class="fa-solid fa-cart-shopping"></i> Your Cart</span>
            <button id="cart-close" style="background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;">&times;</button>
        </div>
        <div id="cart-items" style="flex:1;overflow-y:auto;padding:16px;"></div>
        <div id="cart-footer" style="padding:16px;border-top:1px solid #eee;"></div>
    </div>

    <script src="products.js"></script>
    <script src="script.js"></script>
    <script>
        // Products Page Controller based on filters
        let activeFilters = {
            category: "All",
            minRating: 0,
            minPrice: 0,
            maxPrice: 9999,
            sort: "featured",
            query: ""
        };

        const params = new URLSearchParams(location.search);
        if (params.get("q"))   activeFilters.query    = params.get("q");
        if (params.get("cat")) activeFilters.category = params.get("cat");
        if (activeFilters.query && document.getElementById("amazon-search")) {
            document.getElementById("amazon-search").value = activeFilters.query;
        }
        if (activeFilters.category !== "All") {
            const radio = document.querySelector(`input[name="cat"][value="${activeFilters.category}"]`);
            if (radio) radio.checked = true;
        }

        // Function to filter and sort products based on activeFilters
        function getFilteredProducts() {
            let list = PRODUCTS.slice();

            // Text search
            if (activeFilters.query) {
                const q = activeFilters.query.toLowerCase();
                list = list.filter(p =>
                    p.name.toLowerCase().includes(q) ||
                    p.description.toLowerCase().includes(q) ||
                    p.category.toLowerCase().includes(q)
                );
            }

            // Category
            if (activeFilters.category !== "All") {
                list = list.filter(p => p.category === activeFilters.category);
            }

            // Rating
            list = list.filter(p => p.rating >= activeFilters.minRating);

            // Price
            list = list.filter(p => p.price >= activeFilters.minPrice && p.price <= activeFilters.maxPrice);

            // Sort
            switch (activeFilters.sort) {
                case "price-asc":  list.sort((a,b) => a.price - b.price); break;
                case "price-desc": list.sort((a,b) => b.price - a.price); break;
                case "rating":     list.sort((a,b) => b.rating - a.rating); break;
                case "newest":     list.sort((a,b) => b.id - a.id); break;
            }

            return list;
        }

        // Helper to get badge class based on badge type
        function badgeClass(badge) {
            if (!badge) return "";
            const m = { "Best Seller":"bestseller","Amazon's Choice":"choice","New":"new","Sale":"sale" };
            return m[badge] || "";
        }

        // Funtion for star visualization (alternative to font icons)
        function renderStarsVisual(rating) {
            const pct = (rating / 5) * 100;
            return `<span class="stars-visual" style="background:linear-gradient(to right,#e47911 ${pct}%,#ccc ${pct}%);" 
                    style="-webkit-background-clip:text;">★★★★★</span>`;
        }

        // Function to render star icons based on rating
        function starsFill(rating) {
            let s = "";
            for (let i = 1; i <= 5; i++) {
                if (rating >= i) s += '<i class="fa-solid fa-star" style="color:#e47911;font-size:0.78rem;"></i>';
                else if (rating >= i - 0.5) s += '<i class="fa-solid fa-star-half-stroke" style="color:#e47911;font-size:0.78rem;"></i>';
                else s += '<i class="fa-regular fa-star" style="color:#e47911;font-size:0.78rem;"></i>';
            }
            return s;
        }

        // Function to render products grid based on current filters
        function renderGrid() {
            const products = getFilteredProducts();
            const grid = document.getElementById("product-grid");
            const text = document.getElementById("results-text");
            const wishlist = JSON.parse(localStorage.getItem("amazonWishlist") || "[]");

            const label = activeFilters.query
                ? `<b>${products.length}</b> results for "<b>${activeFilters.query}</b>"`
                : `<b>${products.length}</b> results`;
            text.innerHTML = label;

            if (!products.length) {
                grid.innerHTML = `<div class="no-results" style="grid-column:1/-1">
                    <i class="fa-solid fa-box-open"></i>
                    <p style="font-size:1.1rem;font-weight:700;margin-bottom:8px;">No results found</p>
                    <p style="color:#888;">Try adjusting your filters or search term.</p>
                </div>`;
                return;
            }

            grid.innerHTML = products.map(p => {
                const save = ((p.originalPrice - p.price) / p.originalPrice * 100).toFixed(0);
                const inWishlist = wishlist.includes(p.name);
                return `
                <div class="product-card" onclick="location.href='product.html?id=${p.id}'">
                    ${p.badge ? `<span class="product-badge ${badgeClass(p.badge)}">${p.badge}</span>` : ""}
                    <div class="product-img-wrap">
                        <img src="${p.image}" alt="${p.name}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-stars">
                            <span>${starsFill(p.rating)}</span>
                            <span class="review-count">${p.reviews.toLocaleString()}</span>
                        </div>
                        <div class="product-price">
                            <span class="price-main"><sup>$</sup>${Math.floor(p.price)}<sup>${(p.price % 1 * 100).toFixed(0).padStart(2,"0")}</sup></span>
                            <span class="price-original">$${p.originalPrice.toFixed(2)}</span>
                        </div>
                        <span class="price-save">Save ${save}%</span>
                        <div class="prime-badge">
                            <i class="fa-brands fa-amazon" style="font-size:0.9rem;"></i> Prime FREE Delivery
                        </div>
                    </div>
                    <div class="card-actions" onclick="event.stopPropagation()">
                        <button class="btn-add-cart" onclick="addToCart('${p.name.replace(/'/g,"\\'")}', ${p.price})">
                            Add to Cart
                        </button>
                        <button class="btn-wishlist-card ${inWishlist ? 'active' : ''}" 
                                onclick="toggleWishlist('${p.name.replace(/'/g,"\\'")}');this.classList.toggle('active')"
                                title="Add to Wish List">
                            <i class="fa-${inWishlist ? 'solid' : 'regular'} fa-heart"></i>
                        </button>
                    </div>
                </div>`;
            }).join("");
        }

        // Filter listeners
        document.querySelectorAll("input[name='cat']").forEach(r =>
            r.addEventListener("change", () => { activeFilters.category = r.value; renderGrid(); })
        );
        document.querySelectorAll("input[name='rating']").forEach(r =>
            r.addEventListener("change", () => { activeFilters.minRating = parseFloat(r.value); renderGrid(); })
        );
        document.querySelectorAll("input[name='price']").forEach(r =>
            r.addEventListener("change", () => {
                const [min, max] = r.value.split("-").map(Number);
                activeFilters.minPrice = min; activeFilters.maxPrice = max;
                renderGrid();
            })
        );
        document.getElementById("sort-select").addEventListener("change", e => {
            activeFilters.sort = e.target.value; renderGrid();
        });

        // Function to apply custom price range
        function applyCustomPrice() {
            const min = parseFloat(document.getElementById("min-price").value) || 0;
            const max = parseFloat(document.getElementById("max-price").value) || 9999;
            activeFilters.minPrice = min;
            activeFilters.maxPrice = max;
            renderGrid();
        }

        // Search from this page
        document.getElementById("search-btn").addEventListener("click", () => {
            activeFilters.query = document.getElementById("amazon-search").value;
            renderGrid();
        });
        document.getElementById("amazon-search").addEventListener("keydown", e => {
            if (e.key === "Enter") { activeFilters.query = e.target.value; renderGrid(); }
        });

        // Initial render
        renderGrid();
    </script>
</body>
</html>
