<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Amazon Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #EAEDED; }

        .checkout-wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        /* Progress Steps */
        .progress-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin: 24px 0 32px;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex: 1;
            max-width: 180px;
            position: relative;
        }

        .step:not(:last-child)::after {
            content: "";
            position: absolute;
            top: 18px;
            left: 50%;
            width: 100%;
            height: 2px;
            background: #ccc;
            z-index: 0;
        }

        .step.done:not(:last-child)::after { background: #007600; }

        .step-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #ccc;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            z-index: 1;
            transition: background 0.3s;
        }

        .step.active .step-circle { background: #e47911; }
        .step.done .step-circle { background: #007600; }

        .step-label { font-size: 0.75rem; color: #555; text-align: center; }
        .step.active .step-label { color: #e47911; font-weight: 700; }
        .step.done .step-label { color: #007600; }

        /* Main Layout */
        .checkout-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        .checkout-main { display: flex; flex-direction: column; gap: 16px; }

        /* Panels */
        .checkout-panel {
            background: #fff;
            border-radius: 4px;
            padding: 24px;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
            color: #0F1111;
        }

        /* Form Fields */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .form-row.full { grid-template-columns: 1fr; }

        .form-group { display: flex; flex-direction: column; gap: 4px; }

        .form-group label { font-size: 0.8rem; font-weight: 700; color: #333; }

        .form-group input, .form-group select {
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #e47911;
            box-shadow: 0 0 0 3px rgba(228,121,17,0.15);
        }

        .form-group input.error { border-color: #cc0c39; }

        .field-error { font-size: 0.75rem; color: #cc0c39; display: none; }
        .field-error.show { display: block; }

        /* Payment method cards */
        .payment-methods { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

        .payment-option {
            border: 1.5px solid #ccc;
            border-radius: 4px;
            padding: 14px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .payment-option:hover { border-color: #e47911; }
        .payment-option.selected { border-color: #e47911; background: #fff8ee; }

        .payment-option input[type="radio"] { accent-color: #e47911; }

        .payment-icon { font-size: 1.5rem; width: 30px; text-align: center; }

        .card-fields { display: none; margin-top: 14px; }
        .card-fields.show { display: block; }

        /* Navigation Buttons */
        .step-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }

        .btn-continue {
            padding: 10px 28px;
            background: #FFD814;
            border: 1px solid #FCD200;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-continue:hover { background: #f0c912; }

        .btn-back {
            background: none;
            border: none;
            color: #007185;
            font-size: 0.875rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-back:hover { color: #c45500; }

        /* Order Summary */
        .order-summary {
            background: #fff;
            border-radius: 4px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 70px;
        }

        .order-summary h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 8px;
            color: #333;
        }

        .summary-row.total {
            font-size: 1rem;
            font-weight: 700;
            color: #B12704;
            padding-top: 10px;
            border-top: 1px solid #eee;
            margin-top: 10px;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 0.8rem;
        }

        .summary-item-name {
            flex: 1;
            line-height: 1.3;
        }

        /* Confirmation Step */
        .confirmation-box {
            text-align: center;
            padding: 40px 20px;
        }

        .confirmation-box .check-icon {
            width: 72px;
            height: 72px;
            background: #007600;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        .confirmation-box .check-icon i {
            color: #fff;
            font-size: 2rem;
        }

        .order-id {
            font-size: 0.875rem;
            color: #555;
            margin-bottom: 8px;
        }

        .conf-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; color: #007600; }

        .conf-sub { font-size: 0.875rem; color: #555; line-height: 1.6; margin-bottom: 24px; }

        .conf-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

        .btn-conf {
            padding: 9px 22px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid;
        }

        @media (max-width: 700px) {
            .checkout-layout { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .order-summary { position: static; }
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar" style="justify-content:space-between;padding:0 24px;">
            <div class="nav-logo" onclick="location.href='index.html'" style="cursor:pointer;">
                <div class="logo"></div>
            </div>
            <h1 style="font-size:1.2rem;font-weight:400;color:#fff;margin:0;">Checkout</h1>
            <div style="display:flex;align-items:center;gap:6px;font-size:0.8rem;color:#ccc;">
                <i class="fa-solid fa-lock" style="font-size:0.9rem;"></i> Secure Checkout
            </div>
        </div>
    </header>

    <div class="checkout-wrap">
        <!-- Progress bar for checkout steps -->
        <div class="progress-bar" id="progress-bar">
            <div class="step active" id="step-indicator-1">
                <div class="step-circle">1</div>
                <div class="step-label">Address</div>
            </div>
            <div class="step" id="step-indicator-2">
                <div class="step-circle">2</div>
                <div class="step-label">Payment</div>
            </div>
            <div class="step" id="step-indicator-3">
                <div class="step-circle">3</div>
                <div class="step-label">Review</div>
            </div>
            <div class="step" id="step-indicator-4">
                <div class="step-circle"><i class="fa-solid fa-check"></i></div>
                <div class="step-label">Confirmed</div>
            </div>
        </div>

        <div class="checkout-layout">
            <div class="checkout-main" id="checkout-main"></div>

            <!-- Order Summary -->
            <div class="order-summary">
                <h3>Order Summary</h3>
                <div id="summary-items"></div>
                <div class="summary-row"><span>Items:</span><span id="sum-items">$0.00</span></div>
                <div class="summary-row"><span>Shipping:</span><span style="color:#007600;">FREE</span></div>
                <div class="summary-row"><span>Tax (8%):</span><span id="sum-tax">$0.00</span></div>
                <div class="summary-row total"><span>Order Total:</span><span id="sum-total">$0.00</span></div>
            </div>
        </div>
    </div>

    <script src="products.js"></script>
    <script src="script.js"></script>
    <script>
(function () {
    let currentStep = 1;
    let orderData   = {};

    function getCart() {
        return JSON.parse(localStorage.getItem("amazonCart") || "[]");
    }

    function calcTotals(cartItems) {
        const subtotal = cartItems.reduce((s, i) => s + i.price * i.qty, 0);
        const tax      = subtotal * 0.08;
        const total    = subtotal + tax;
        return { subtotal, tax, total };
    }

    // Populate order summary sidebar
    function refreshSummary() {
        const cartItems = getCart();
        const { subtotal, tax, total } = calcTotals(cartItems);

        document.getElementById("sum-items").textContent  = "$" + subtotal.toFixed(2);
        document.getElementById("sum-tax").textContent    = "$" + tax.toFixed(2);
        document.getElementById("sum-total").textContent  = "$" + total.toFixed(2);

        document.getElementById("summary-items").innerHTML =
            cartItems.length
            ? cartItems.map(i => `
                <div class="summary-item">
                    <div class="summary-item-name">${i.name} <span style="color:#555;">×${i.qty}</span></div>
                    <div style="font-weight:600;white-space:nowrap;">$${(i.price * i.qty).toFixed(2)}</div>
                </div>`).join("")
            : '<p style="color:#888;font-size:0.8rem;padding:8px 0;">Your cart is empty.</p>';
    }

    // Function to update progress bar based on current step
    function updateProgress(step) {
        for (let i = 1; i <= 4; i++) {
            const el = document.getElementById("step-indicator-" + i);
            if (!el) continue;
            el.classList.remove("active", "done");
            if (i < step) el.classList.add("done");
            else if (i === step) el.classList.add("active");
        }
    }

    // STEP 1: Address
    function renderStep1() {
        document.getElementById("checkout-main").innerHTML = `
            <div class="checkout-panel">
                <div class="panel-title">
                    <i class="fa-solid fa-location-dot" style="color:#e47911;margin-right:8px;"></i>Delivery Address
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fname">First Name *</label>
                        <input type="text" id="fname" value="${orderData.fname||''}" placeholder="John" autocomplete="given-name">
                        <span class="field-error" id="err-fname">Please enter your first name</span>
                    </div>
                    <div class="form-group">
                        <label for="lname">Last Name *</label>
                        <input type="text" id="lname" value="${orderData.lname||''}" placeholder="Doe" autocomplete="family-name">
                        <span class="field-error" id="err-lname">Please enter your last name</span>
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label for="street">Street Address *</label>
                        <input type="text" id="street" value="${orderData.street||''}" placeholder="123 Main Street" autocomplete="address-line1">
                        <span class="field-error" id="err-street">Please enter a street address</span>
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label for="apt">Apartment, suite, etc. (optional)</label>
                        <input type="text" id="apt" value="${orderData.apt||''}" placeholder="Apt 4B" autocomplete="address-line2">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City *</label>
                        <input type="text" id="city" value="${orderData.city||''}" placeholder="Mumbai" autocomplete="address-level2">
                        <span class="field-error" id="err-city">Please enter a city</span>
                    </div>
                    <div class="form-group">
                        <label for="state">State *</label>
                        <select id="state" autocomplete="address-level1">
                            <option value="">Select state…</option>
                            ${["Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chhattisgarh","Delhi","Goa","Gujarat","Haryana","Himachal Pradesh","Jharkhand","Karnataka","Kerala","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal"].map(s => `<option ${orderData.state===s?'selected':''}>${s}</option>`).join("")}
                        </select>
                        <span class="field-error" id="err-state">Please select a state</span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="pin">PIN Code *</label>
                        <input type="text" id="pin" value="${orderData.pin||''}" placeholder="400001" maxlength="6"
                            inputmode="numeric" pattern="[0-9]{6}" autocomplete="postal-code">
                        <span class="field-error" id="err-pin">Enter a valid 6-digit PIN</span>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone *</label>
                        <input type="tel" id="phone" value="${orderData.phone||''}" placeholder="+91 9876543210" autocomplete="tel">
                        <span class="field-error" id="err-phone">Please enter your phone number</span>
                    </div>
                </div>
                <div class="step-buttons">
                    <button class="btn-back" onclick="location.href='index.html'">
                        <i class="fa-solid fa-chevron-left"></i> Return to Cart
                    </button>
                    <button class="btn-continue" onclick="submitStep1()">
                        Continue to Payment <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>`;
    }

    // Step 1: Validation and Data Collection
    window.submitStep1 = function() {
        const fields = [
            { id: "fname",  err: "err-fname",  validate: v => v.trim().length > 0 },
            { id: "lname",  err: "err-lname",  validate: v => v.trim().length > 0 },
            { id: "street", err: "err-street", validate: v => v.trim().length > 0 },
            { id: "city",   err: "err-city",   validate: v => v.trim().length > 0 },
            { id: "state",  err: "err-state",  validate: v => v !== "" },
            { id: "pin",    err: "err-pin",    validate: v => /^\d{6}$/.test(v.trim()) },
            { id: "phone",  err: "err-phone",  validate: v => v.trim().length >= 7 }
        ];
        let valid = true;
        let firstInvalid = null;
        fields.forEach(f => {
            const el  = document.getElementById(f.id);
            const err = document.getElementById(f.err);
            if (el && !f.validate(el.value)) {
                el.classList.add("error");
                if (err) err.classList.add("show");
                if (!firstInvalid) firstInvalid = el;
                valid = false;
            } else {
                if (el) el.classList.remove("error");
                if (err) err.classList.remove("show");
            }
        });
        if (!valid) {
            firstInvalid?.focus();   // FIX: focus first invalid field for accessibility
            return;
        }
        orderData = {
            fname:  document.getElementById("fname").value.trim(),
            lname:  document.getElementById("lname").value.trim(),
            street: document.getElementById("street").value.trim(),
            apt:    document.getElementById("apt").value.trim(),
            city:   document.getElementById("city").value.trim(),
            state:  document.getElementById("state").value,
            pin:    document.getElementById("pin").value.trim(),
            phone:  document.getElementById("phone").value.trim(),
        };
        goToStep(2);
    }

    // STEP 2: Payment (Credit Card, UPI, COD)
    function renderStep2() {
        const selectedType = orderData.paymentType || "card";
        document.getElementById("checkout-main").innerHTML = `
            <div class="checkout-panel">
                <div class="panel-title">
                    <i class="fa-solid fa-credit-card" style="color:#e47911;margin-right:8px;"></i>Payment Method
                </div>
                <div class="payment-methods">
                    <label class="payment-option ${selectedType==='card'?'selected':''}" id="opt-card" onclick="selectPayment('card')">
                        <input type="radio" name="payment" value="card" ${selectedType==='card'?'checked':''}>
                        <span class="payment-icon">💳</span>
                        <div>
                            <div style="font-weight:700;font-size:0.875rem;">Credit or Debit Card</div>
                            <div style="font-size:0.75rem;color:#555;">Visa, Mastercard, RuPay</div>
                        </div>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg"
                            style="height:20px;margin-left:auto;" onerror="this.style.display='none'"
                            alt="Visa">
                    </label>
                    <label class="payment-option ${selectedType==='upi'?'selected':''}" id="opt-upi" onclick="selectPayment('upi')">
                        <input type="radio" name="payment" value="upi" ${selectedType==='upi'?'checked':''}>
                        <span class="payment-icon">📱</span>
                        <div>
                            <div style="font-weight:700;font-size:0.875rem;">UPI</div>
                            <div style="font-size:0.75rem;color:#555;">GPay, PhonePe, Paytm</div>
                        </div>
                    </label>
                    <label class="payment-option ${selectedType==='cod'?'selected':''}" id="opt-cod" onclick="selectPayment('cod')">
                        <input type="radio" name="payment" value="cod" ${selectedType==='cod'?'checked':''}>
                        <span class="payment-icon">💵</span>
                        <div>
                            <div style="font-weight:700;font-size:0.875rem;">Cash on Delivery</div>
                            <div style="font-size:0.75rem;color:#555;">Pay when your order arrives</div>
                        </div>
                    </label>
                </div>

                <!-- Card Fields -->
                <div class="card-fields ${selectedType==='card'?'show':''}" id="card-fields">
                    <div class="form-row full">
                        <div class="form-group">
                            <label for="card-num">Card Number *</label>
                            <input type="text" id="card-num" placeholder="1234 5678 9012 3456" maxlength="19"
                                inputmode="numeric" autocomplete="cc-number"
                                oninput="this.value=this.value.replace(/[^0-9]/g,'').replace(/(.{4})/g,'$1 ').trim().slice(0,19)">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="card-exp">Expiry Date *</label>
                            <input type="text" id="card-exp" placeholder="MM/YY" maxlength="5"
                                inputmode="numeric" autocomplete="cc-exp"
                                oninput="formatExpiry(this)">
                        </div>
                        <div class="form-group">
                            <label for="card-cvv">CVV *</label>
                            <input type="password" id="card-cvv" placeholder="•••" maxlength="4"
                                inputmode="numeric" autocomplete="cc-csc"
                                oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="form-group">
                            <label for="card-name">Name on Card *</label>
                            <input type="text" id="card-name" placeholder="JOHN DOE" autocomplete="cc-name"
                                value="${orderData.cardName||''}">
                        </div>
                    </div>
                </div>

                <!-- UPI Fields -->
                <div class="card-fields ${selectedType==='upi'?'show':''}" id="upi-fields">
                    <div class="form-group">
                        <label for="upi-id">UPI ID *</label>
                        <input type="text" id="upi-id" placeholder="yourname@upi" value="${orderData.upiId||''}">
                        <span class="field-error" id="err-upi">Enter a valid UPI ID (e.g. name@upi)</span>
                    </div>
                </div>

                <div class="step-buttons">
                    <button class="btn-back" onclick="goToStep(1)">
                        <i class="fa-solid fa-chevron-left"></i> Back
                    </button>
                    <button class="btn-continue" onclick="submitStep2()">
                        Review Order <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>`;
    }

    // Expiry formatting helper for card input (MM/YY)
    window.formatExpiry = function(input) {
        let v = input.value.replace(/[^0-9]/g,'');
        if (v.length >= 3) v = v.slice(0,2) + '/' + v.slice(2,4);
        input.value = v;
    };

    // Show/hide relavent fields based on payment type selection
    window.selectPayment = function(type) {
        ["card","upi","cod"].forEach(t => {
            document.getElementById("opt-"+t)?.classList.remove("selected");
            const fieldsEl = document.getElementById(t+"-fields");
            if (fieldsEl) fieldsEl.classList.remove("show");
        });
        document.getElementById("opt-"+type)?.classList.add("selected");
        if (type !== "cod") {
            const fieldsEl = document.getElementById(type+"-fields");
            if (fieldsEl) fieldsEl.classList.add("show");
        }
        orderData.paymentType = type;
    };

    // Field requirements based on selected payment type, then proceed to review step
    window.submitStep2 = function() {
        const type = orderData.paymentType || "card";

        if (type === "card") {
            const num  = document.getElementById("card-num")?.value.replace(/\s/g,'');
            const exp  = document.getElementById("card-exp")?.value;
            const cvv  = document.getElementById("card-cvv")?.value;
            const name = document.getElementById("card-name")?.value.trim();
            if (!num || num.length < 16 || !exp || exp.length < 5 || !cvv || cvv.length < 3 || !name) {
                if (typeof showToast !== "undefined") showToast("Please fill in all card details.", "error");
                else alert("Please fill in all card details.");
                return;
            }
            orderData.cardName = name;
        }

        if (type === "upi") {
            const upiId = document.getElementById("upi-id")?.value.trim();
            const err   = document.getElementById("err-upi");
            if (!upiId || !/^[\w.\-]+@[\w]+$/.test(upiId)) {
                document.getElementById("upi-id")?.classList.add("error");
                if (err) err.classList.add("show");
                return;
            } else {
                document.getElementById("upi-id")?.classList.remove("error");
                if (err) err.classList.remove("show");
            }
            orderData.upiId = upiId;
        }

        goToStep(3);
    }

    // STEP 3: Review
    function renderStep3() {
        const cartItems = getCart();
        const { total } = calcTotals(cartItems);
        const addr = `${orderData.fname} ${orderData.lname}, ${orderData.street}${orderData.apt ? ", "+orderData.apt : ""}, ${orderData.city}, ${orderData.state} − ${orderData.pin}`;
        const payLabel = orderData.paymentType === "upi"  ? `UPI (${orderData.upiId||""})` :
                         orderData.paymentType === "cod"  ? "Cash on Delivery" :
                         orderData.cardName               ? `Card ending in •••• (${orderData.cardName})` :
                                                            "Credit/Debit Card";

        document.getElementById("checkout-main").innerHTML = `
            <div class="checkout-panel">
                <div class="panel-title">
                    <i class="fa-solid fa-clipboard-check" style="color:#e47911;margin-right:8px;"></i>Review Your Order
                </div>

                <div style="background:#f8f8f8;border-radius:4px;padding:14px;margin-bottom:16px;font-size:0.875rem;">
                    <div style="font-weight:700;margin-bottom:6px;">
                        <i class="fa-solid fa-location-dot" style="color:#e47911;margin-right:6px;"></i>Delivery Address
                    </div>
                    <div>${addr}</div>
                    <div style="color:#555;margin-top:4px;">📞 ${orderData.phone}</div>
                    <button onclick="goToStep(1)" style="background:none;border:none;color:#007185;cursor:pointer;font-size:0.78rem;padding:0;margin-top:6px;display:inline-block;">Change</button>
                </div>

                <div style="background:#f8f8f8;border-radius:4px;padding:14px;margin-bottom:16px;font-size:0.875rem;">
                    <div style="font-weight:700;margin-bottom:6px;">
                        <i class="fa-solid fa-credit-card" style="color:#e47911;margin-right:6px;"></i>Payment Method
                    </div>
                    <div>${payLabel}</div>
                    <button onclick="goToStep(2)" style="background:none;border:none;color:#007185;cursor:pointer;font-size:0.78rem;padding:0;margin-top:6px;display:inline-block;">Change</button>
                </div>

                <div style="font-weight:700;margin-bottom:10px;font-size:0.875rem;">Order Items (${cartItems.length})</div>
                ${cartItems.map(i => `
                    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:0.875rem;">
                        <span>${i.name} × ${i.qty}</span>
                        <span style="font-weight:600;">$${(i.price * i.qty).toFixed(2)}</span>
                    </div>`).join("")}

                <div style="display:flex;justify-content:space-between;padding:14px 0 0;font-size:1rem;font-weight:700;color:#B12704;">
                    <span>Order Total:</span>
                    <span>$${total.toFixed(2)}</span>
                </div>

                <div class="step-buttons">
                    <button class="btn-back" onclick="goToStep(2)">
                        <i class="fa-solid fa-chevron-left"></i> Back
                    </button>
                    <button class="btn-continue" style="background:#FFA41C;border-color:#FF8F00;font-size:1rem;padding:12px 32px;" onclick="placeOrder()">
                        Place Order — $${total.toFixed(2)}
                    </button>
                </div>
            </div>`;
    }

    // STEP 4: Confirmation
    function renderStep4() {
        const orderId = "113-" + Math.floor(1000000 + Math.random() * 9000000) + "-" + Math.floor(1000000 + Math.random() * 9000000);
        const deliveryDate = new Date(Date.now() + 2 * 24 * 60 * 60 * 1000);
        const deliveryStr  = deliveryDate.toLocaleDateString("en-IN", { weekday:"long", month:"long", day:"numeric" });

        document.getElementById("checkout-main").innerHTML = `
            <div class="checkout-panel">
                <div class="confirmation-box">
                    <div class="check-icon"><i class="fa-solid fa-check"></i></div>
                    <div class="order-id">Order # ${orderId}</div>
                    <div class="conf-title">Order Placed! Thank you.</div>
                    <div class="conf-sub">
                        Your order has been confirmed and will be delivered by<br>
                        <b>${deliveryStr}</b>.<br><br>
                        A confirmation email has been sent to your address.
                    </div>
                    <div class="conf-actions">
                        <button class="btn-conf" style="background:#FFD814;border-color:#FCD200;" onclick="location.href='index.html'">
                            Continue Shopping
                        </button>
                        <button class="btn-conf" style="background:#fff;border-color:#ccc;" onclick="location.href='products.html'">
                            View All Products
                        </button>
                    </div>
                </div>
            </div>`;

        localStorage.removeItem("amazonCart");
        if (typeof updateCartBadge === "function") updateCartBadge();
    }

    // Navigate to switch between steps and render appropriate content
    window.goToStep = function(step) {
        currentStep = step;
        updateProgress(step);
        if (step === 1) renderStep1();
        else if (step === 2) renderStep2();
        else if (step === 3) renderStep3();
        else if (step === 4) renderStep4();
        window.scrollTo({ top: 0, behavior: "smooth" });
    };

    // Final step: Place order (simulate processing and show confirmation)
    window.placeOrder = function() {
        const cartItems = getCart();
        if (!cartItems.length) {
            if (typeof showToast !== "undefined") showToast("Your cart is empty!", "error");
            else alert("Your cart is empty!");
            return;
        }
        goToStep(4);
    }

    // Init
    refreshSummary();
    goToStep(1);
})();
    </script>
</body>
</html>
